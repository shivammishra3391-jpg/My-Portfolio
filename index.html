<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Shivam-dev</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <header>
            <nav class="navbar">

                <!-- Logo -->
                <div class="logo">
                    <img src="assets/logo.png" alt="Logo">
                    <h2>Shivam Mishra</h2>
                </div>

                <!-- Navigation Links -->
                <ul class="nav-links">
                    <li><a href="#home">Home</a></li>
                    <li><a href="#about">About</a></li>
                    <li><a href="#skills">Skills</a></li>
                    <li><a href="#projects">Projects</a></li>
                    <li><a href="#contact">Contact</a></li>

                <!-- Resume Button -->
                <a href="#" class="resume-btn">

            </nav>
        </header>
        <main>
            <!-- Hero Section -->
            <section class="hero" id="home">

                <!-- left content -->
                <div class="hero-content">

                    <p class="hero-intro">Hello, I'm</p>

                    <h1>Shivam Mishra</h1>

                    <h2>Web Developer</h2>
                    
                    <p class="hero-description">
                        I am a B.Tech CSE student passionate about
                        programming, web development and technology.
                        I enjoy learning new skills and building projects.
                    </p>
                    <div class="hero-buttons">
                        <a href="#projects" class="primary-btn">View Projects</a>
                        <a href="#contact" class="secondary-btn">Contact Me</a>
                    </div>
                </div>

                <!-- right content -->
                <div class="hero-image">
                    <img src="assets/profile.jpeg" alt="Hero Image">
                </div>
            </section>
        </main>

    </body>
</html>
